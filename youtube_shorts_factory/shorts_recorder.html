<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickOps AI Shorts Recorder</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0d12;
      color: #e8edf7;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 24px;
      padding: 24px;
      box-sizing: border-box;
    }
    aside {
      border: 1px solid #263142;
      background: #101722;
      border-radius: 8px;
      padding: 18px;
      height: fit-content;
    }
    label, button, select {
      display: block;
      width: 100%;
      box-sizing: border-box;
    }
    select, button {
      margin-top: 8px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #324054;
      background: #151f2d;
      color: #f7f9fc;
      font: inherit;
    }
    button {
      cursor: pointer;
      background: #4f8cff;
      border-color: #4f8cff;
      color: #06101f;
      font-weight: 700;
    }
    button.secondary {
      background: #151f2d;
      color: #e8edf7;
    }
    .stage-wrap {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 48px);
    }
    canvas {
      width: min(390px, calc((100vh - 64px) * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 8px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      background: #090d14;
    }
    .hint {
      font-size: 13px;
      color: #95a3b8;
      line-height: 1.5;
    }
    a { color: #8db4ff; }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; }
      .stage-wrap { min-height: auto; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>QuickOps AI Shorts</h1>
    <p class="hint">Original 9:16 Shorts generator. It records the animated canvas to a local WebM file. No stock footage, no reused video.</p>
    <label>
      Short
      <select id="shortSelect"></select>
    </label>
    <button id="previewBtn" class="secondary">Preview</button>
    <button id="recordBtn">Record WebM</button>
    <p class="hint" id="status">Ready.</p>
    <p class="hint">Upload the downloaded WebM to YouTube. Use metadata from <code>shorts_metadata.csv</code>.</p>
  </aside>

  <main class="stage-wrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </main>

  <script>
    const shorts = [
      {
        id: "short_001",
        title: "AI AGENT LEAK",
        hook: "Your AI agent can leak private context in one click.",
        beats: [
          "Hidden instruction",
          "Agent trusts it",
          "Private context moves",
          "Bigger prompt won't fix it",
          "Boundaries + approvals"
        ],
        cta: "USD 100 AI workflow audit"
      },
      {
        id: "short_002",
        title: "LEAD FLOW",
        hook: "The cheapest CRM is a spreadsheet that never misses a lead.",
        beats: [
          "Form captured",
          "Sheet updated",
          "Status tracked",
          "Reply template ready",
          "Follow-up before cold"
        ],
        cta: "USD 100 QuickOps pilot"
      },
      {
        id: "short_003",
        title: "PROMPT INJECTION",
        hook: "Prompt injection is not a prompt problem.",
        beats: [
          "Chat is low impact",
          "Tools change risk",
          "Email, CRM, files, APIs",
          "Permissions matter",
          "Test the workflow"
        ],
        cta: "Audit one agent workflow"
      },
      {
        id: "short_004",
        title: "APPROVAL STEP",
        hook: "One missing approval step can cost more than the whole automation.",
        beats: [
          "Automation saves time",
          "Irreversible actions need checks",
          "Refunds, deletes, exports",
          "Approve high-risk steps",
          "Fast systems need brakes"
        ],
        cta: "Fix one risky workflow"
      },
      {
        id: "short_005",
        title: "REVENUE LEAK",
        hook: "A lead response delay is a revenue leak.",
        beats: [
          "New inquiry arrives",
          "Nobody sees it",
          "Buyer moves on",
          "Tiny workflow fixes it",
          "Capture, track, reply"
        ],
        cta: "Build one lead workflow"
      }
    ];

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const select = document.getElementById("shortSelect");
    const statusEl = document.getElementById("status");
    const W = canvas.width;
    const H = canvas.height;
    let start = 0;
    let raf = null;

    for (const item of shorts) {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = `${item.id} - ${item.title}`;
      select.appendChild(opt);
    }

    function selectedShort() {
      return shorts.find(s => s.id === select.value) || shorts[0];
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapText(text, x, y, maxWidth, lineHeight, maxLines = 6) {
      const words = text.split(" ");
      let line = "";
      let lines = [];
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      lines = lines.slice(0, maxLines);
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, y + i * lineHeight);
      }
      return lines.length * lineHeight;
    }

    function draw(t, item) {
      const seconds = t / 1000;
      const beatIndex = Math.min(item.beats.length - 1, Math.floor(seconds / 2.8));
      const local = (seconds % 2.8) / 2.8;
      const pulse = 0.5 + Math.sin(seconds * 2.2) * 0.5;

      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, "#07111f");
      grad.addColorStop(0.42, "#10233a");
      grad.addColorStop(1, "#090d14");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#4f8cff";
      ctx.beginPath();
      ctx.arc(930, 220 + Math.sin(seconds) * 60, 360, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#20d6a0";
      ctx.beginPath();
      ctx.arc(100, 1500 + Math.cos(seconds * 0.8) * 80, 320, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = "#b8c7df";
      ctx.font = "700 42px system-ui, sans-serif";
      ctx.fillText("QUICKOPS AI LAB", 78, 110);

      ctx.fillStyle = "#ffffff";
      ctx.font = "800 86px system-ui, sans-serif";
      wrapText(item.hook, 78, 280, 930, 98, 5);

      const cardY = 880;
      roundRect(70, cardY, 940, 360, 26);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#20d6a0";
      ctx.font = "800 48px system-ui, sans-serif";
      ctx.fillText(`STEP ${beatIndex + 1}`, 110, cardY + 76);

      ctx.fillStyle = "#f7f9fc";
      ctx.font = "800 72px system-ui, sans-serif";
      ctx.globalAlpha = Math.min(1, local * 2);
      wrapText(item.beats[beatIndex], 110, cardY + 170, 840, 82, 3);
      ctx.globalAlpha = 1;

      const barX = 78;
      const barY = 1325;
      const barW = 924;
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      roundRect(barX, barY, barW, 18, 9);
      ctx.fill();
      ctx.fillStyle = "#4f8cff";
      roundRect(barX, barY, barW * Math.min(1, seconds / 15), 18, 9);
      ctx.fill();

      roundRect(70, 1460, 940, 250, 28);
      ctx.fillStyle = `rgba(79, 140, 255, ${0.22 + pulse * 0.08})`;
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 62px system-ui, sans-serif";
      wrapText(item.cta, 110, 1545, 850, 72, 3);
      ctx.fillStyle = "#cdd8ea";
      ctx.font = "600 34px system-ui, sans-serif";
      ctx.fillText("link in description", 110, 1684);

      ctx.fillStyle = "rgba(255,255,255,0.68)";
      ctx.font = "600 30px system-ui, sans-serif";
      ctx.fillText("aldorizona10-glitch.github.io/quickops-ai", 78, 1835);
    }

    function play() {
      cancelAnimationFrame(raf);
      start = performance.now();
      const item = selectedShort();
      function frame(now) {
        const elapsed = now - start;
        draw(elapsed, item);
        if (elapsed < 15000) raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    }

    async function record() {
      play();
      statusEl.textContent = "Recording 15 seconds...";
      const stream = canvas.captureStream(30);
      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      recorder.ondataavailable = e => {
        if (e.data.size) chunks.push(e.data);
      };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${selectedShort().id}-quickops-ai.webm`;
        a.click();
        statusEl.textContent = "Done. WebM downloaded.";
      };
      recorder.start();
      setTimeout(() => recorder.stop(), 15200);
    }

    document.getElementById("previewBtn").addEventListener("click", play);
    document.getElementById("recordBtn").addEventListener("click", record);
    select.addEventListener("change", play);
    play();
  </script>
</body>
</html>
